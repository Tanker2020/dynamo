<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynamo Ground School</title>
<meta name="description" content="An interactive onboarding course for NVIDIA Dynamo: LLM inference, GPUs, Rust and the Dynamo codebase, from zero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a late-night bench. Fixed curriculum rail on the left, the lesson on an oscilloscope-style graticule,
   terminal-style margin comments, phosphor green for anything live, amber for the one line you must remember.
   Dark is the default on every device. A light "day shift" theme exists only behind the toggle. */
:root {
  --paper: #07090a;          /* the room */
  --sheet: #0d1210;          /* panels */
  --sheet-2: #111813;        /* raised panels, code */
  --ink: #d9e4dc;            /* body text, slightly green-white */
  --ink-soft: #94a59a;
  --ink-faint: #5d6d62;
  --rule: #1d2a22;
  --rule-strong: #2c3f33;
  --grid: rgba(118, 214, 120, 0.045);
  --accent: #7ee36f;         /* phosphor green */
  --accent-ink: #061006;
  --accent-soft: #13261a;
  --glow: 0 0 0 1px rgba(126, 227, 111, .35), 0 0 24px -6px rgba(126, 227, 111, .35);
  --hl: #ffb547;             /* amber: highlights and "remember this" */
  --hl-ink: #1c1100;
  --hl-text: #ffc061;
  --grid-major: rgba(118, 214, 120, 0.075);
  --vignette: rgba(126, 227, 111, 0.07);
  --pencil: #ff6b57;         /* errors, wrong answers */
  --pencil-soft: #2a1411;
  --good: #7ee36f;
  --good-soft: #10241a;
  --warn: #ffb547;
  --warn-soft: #251b0c;
  --code-bg: #0a0f0c;
  --code-ink: #cfe0d4;
  --tok-kw: #c792ea;
  --tok-str: #a5e07a;
  --tok-com: #5d6d62;
  --tok-num: #ffb547;
  --tok-type: #6fd3e0;
  --tok-fn: #ffd27a;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 14px 40px -18px rgba(0, 0, 0, .9);
  --c1: #7ee36f; --c2: #ff6b57; --c3: #6fd3e0; --c4: #c792ea; --c5: #ffb547; --c6: #4fa3ff;

  --f-display: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-hand: var(--f-mono);

  --rail-w: 300px;
  --header-h: 56px;
  --measure: 46rem;
  --radius: 6px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --paper: #eef1ec; --sheet: #f8faf7; --sheet-2: #f1f4ef; --ink: #121a15; --ink-soft: #46554b; --ink-faint: #7a887f;
  --rule: #d4dcd5; --rule-strong: #b9c6bc; --grid: rgba(20, 90, 40, 0.06); --accent: #1f7a2c; --accent-ink: #ffffff;
  --accent-soft: #dcefdc; --glow: 0 0 0 1px rgba(31, 122, 44, .35); --hl: #ffcf70; --hl-ink: #241600; --hl-text: #8a5200; --grid-major: rgba(20, 90, 40, 0.1); --vignette: rgba(31, 122, 44, 0.05);
  --pencil: #c63b28; --pencil-soft: #fbe5df; --good: #1f7a2c; --good-soft: #dcefdc; --warn: #9a6200; --warn-soft: #fbefd5;
  --code-bg: #f1f4ef; --code-ink: #18221b; --tok-kw: #7b2fa8; --tok-str: #2f7a1f; --tok-com: #7a887f;
  --tok-num: #a35400; --tok-type: #0b6f80; --tok-fn: #8a5a00;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.18);
  --c1: #1f7a2c; --c2: #c63b28; --c3: #0b6f80; --c4: #7b2fa8; --c5: #9a6200; --c6: #2457b8;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0;
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16.5px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
/* The graticule lives on one fixed, GPU-composited layer that is painted once.
   (A multi-layer background with background-attachment: fixed repaints the whole viewport on every scroll frame.) */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    radial-gradient(1100px 520px at 75% -8%, var(--vignette), transparent 65%),
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  transform: translateZ(0);
  will-change: transform;
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -0.005em; }
::selection { background: var(--accent); color: var(--accent-ink); }
code, kbd, pre { font-family: var(--f-mono); }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  height: var(--header-h);
  display: flex; align-items: center; gap: 14px;
  padding-inline: 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; white-space: nowrap; }
.brand-name span { color: var(--accent); }
.topbar .spacer { flex: 1; }
.progress-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.progress-bar { width: 160px; height: 8px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.progress-bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .5s ease; }
.progress-label { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px;
  border: 1px solid var(--rule); border-radius: 99px; background: var(--sheet);
  font-size: 13px; white-space: nowrap; cursor: pointer;
}
.rank-chip b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.rank-chip .wings { width: 22px; height: 22px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; font-family: var(--f-mono); }
.icon-btn {
  display: inline-grid; place-items: center; height: 36px; min-width: 36px; padding: 0 10px; gap: 6px;
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; cursor: pointer; font-size: 14px;
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100vh - var(--header-h)); }
.rail {
  position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--header-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto; padding: 18px 14px 40px 16px;
  border-right: 1px solid var(--rule);
  background: color-mix(in srgb, var(--paper) 70%, var(--sheet));
}
.rail-home {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; color: var(--ink); font-weight: 700; margin-bottom: 8px;
}
.rail-home:hover, .rail-home.active { background: var(--accent-soft); }
.chapter { margin-top: 14px; }
.chapter-head {
  display: flex; align-items: baseline; gap: 8px; padding: 0 10px 6px;
  font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
}
.chapter-head .ch-title { color: var(--ink-soft); font-weight: 600; }
.chapter-head .ch-count { margin-left: auto; font-variant-numeric: tabular-nums; }
.lesson-link {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3;
}
.lesson-link:hover { background: var(--accent-soft); }
.lesson-link.active { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.lesson-link .dot {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
}
.lesson-link.done .dot { background: var(--good); border-color: var(--good); color: var(--sheet); }
.lesson-link.active .dot { border-color: var(--accent); box-shadow: 0 0 10px -2px var(--accent); }
.lesson-link.active.done .dot { background: var(--accent); color: var(--accent-ink); }
.lesson-link .mins { font-family: var(--f-mono); font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }

.main { min-width: 0; padding-inline: 16px; padding-block: 28px 120px; }
.page { max-width: 62rem; margin: 0 auto; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 34px; }
.hero h1 { font-size: clamp(38px, 5.6vw, 68px); font-weight: 700; letter-spacing: -0.015em; line-height: 1.02; }
.hero h1 .swipe { color: var(--accent); text-shadow: 0 0 28px rgba(126, 227, 111, .25); }
.cursor { display: inline-block; width: .42em; height: .78em; margin-left: .1em; background: var(--accent); vertical-align: -.02em; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero .prompt { font-family: var(--f-mono); font-size: 13px; color: var(--ink-faint); letter-spacing: .02em; margin-bottom: 14px; }
.hero .prompt b { color: var(--accent); font-weight: 500; }
.hero p.lede { font-size: 19px; color: var(--ink-soft); max-width: 34rem; margin: 16px 0 22px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--rule-strong); background: var(--sheet-2); color: var(--ink); font-weight: 500; text-decoration: none; font-size: 14px; font-family: var(--f-mono);
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { box-shadow: var(--glow); }
.btn:hover { border-color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: 14px; border-width: 1px; }
.btn.ghost { border-color: var(--rule); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.hero-card { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 18px; box-shadow: var(--shadow); }
.hero-card .hand { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-faint); line-height: 1.5; }
.hero-card .hand::before { content: "// "; }
.hero-card .term-bar { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-faint); margin: -4px 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.hero-card .term-bar b { color: var(--accent); font-weight: 500; }

.route-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.route-stop {
  position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 16px 14px;
  text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px;
}
.route-stop:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.route-stop .num { font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint); letter-spacing: .08em; }
.route-stop h3 { font-size: 21px; }
.route-stop p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.45; }
.route-stop .meter { height: 6px; border-radius: 99px; background: var(--rule); overflow: hidden; margin-top: auto; }
.route-stop .meter i { display: block; height: 100%; background: var(--good); }
.route-stop .meta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.section-label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin: 36px 0 12px; }

/* ---------- lesson ---------- */
.lesson-head { margin-bottom: 26px; max-width: var(--measure); }
.crumbs { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-faint); letter-spacing: .04em; display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs b { color: var(--accent); font-weight: 600; }
.lesson-head h1 { font-size: clamp(32px, 4.4vw, 50px); font-weight: 700; letter-spacing: -0.01em; margin: 10px 0 12px; }
.lesson-head .summary { font-size: 19px; color: var(--ink-soft); margin: 0; }
.objectives { margin: 18px 0 0; padding: 14px 16px; border: 1px dashed var(--rule); border-radius: 10px; background: var(--sheet); }
.objectives h4 { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; }
.objectives ul { margin: 0; padding-left: 20px; }

.prose { max-width: var(--measure); }
.prose > * + * { margin-top: 1em; }
.prose h2 { font-size: 27px; margin-top: 2em; font-weight: 700; letter-spacing: -0.005em; }
.prose h2::before { content: "## "; font-family: var(--f-mono); font-size: .6em; color: var(--accent); vertical-align: .2em; opacity: .8; }
.prose h3 { font-size: 21px; margin-top: 1.6em; font-weight: 700; }
.prose p, .prose li { color: var(--ink); }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: .35em; }
.prose code:not(pre code) { font-size: .86em; background: var(--code-bg); border: 1px solid var(--rule); padding: .08em .35em; border-radius: 5px; }
.prose strong { font-weight: 700; }
mark, .hl { background: color-mix(in srgb, var(--hl) 14%, transparent); color: var(--hl-text); box-shadow: inset 0 -1px 0 var(--hl); padding: 0 .2em; }
.term { border-bottom: 2px dotted var(--accent); cursor: help; }
.wide { max-width: none; }

.callout { border-left: 4px solid var(--accent); background: var(--sheet); padding: 12px 16px; border-radius: 0 10px 10px 0; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.good { border-color: var(--good); background: var(--good-soft); }
.callout.analogy { border-color: var(--c4); }
.callout > b:first-child { display: block; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; color: var(--ink-soft); }
.margin-note { font-family: var(--f-mono); font-size: 13.5px; color: var(--accent); line-height: 1.55; border-left: 2px solid var(--rule-strong); padding: 2px 0 2px 12px; }
.margin-note::before { content: "// "; color: var(--ink-faint); }

.codeblock { border: 1px solid var(--rule); border-radius: 10px; background: var(--code-bg); overflow: hidden; max-width: var(--measure); }
.codeblock.wide { max-width: none; }
.codeblock .code-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); }
.codeblock .code-head .lang { text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
.codeblock .code-head a { color: var(--ink-soft); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.codeblock .code-head a:hover { color: var(--accent); text-decoration: underline; }
.codeblock .code-head .copy { margin-left: auto; border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 2px 8px; font-size: 11.5px; cursor: pointer; font-family: var(--f-mono); }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; color: var(--code-ink); tab-size: 4; }
.tk-kw { color: var(--tok-kw); font-weight: 600; } .tk-str { color: var(--tok-str); } .tk-com { color: var(--tok-com); font-style: italic; }
.tk-num { color: var(--tok-num); } .tk-ty { color: var(--tok-type); } .tk-fn { color: var(--tok-fn); } .tk-mac { color: var(--tok-fn); font-weight: 600; }
.codeblock .ann { display: block; background: color-mix(in srgb, var(--hl) 35%, transparent); margin: 0 -16px; padding: 0 16px; }

.figure { margin: 26px 0; }
.figure figcaption { font-size: 14px; color: var(--ink-soft); margin-top: 8px; max-width: var(--measure); }

/* ---------- widgets ---------- */
.widget {
  background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 8px; padding: 18px; margin: 28px 0;
  box-shadow: var(--shadow); min-width: 0;
}
.widget-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.widget-title .tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 1px 7px; border-radius: 3px; font-weight: 500; }
.widget-title .tag::before { content: "● "; }
.widget-title h3 { font-family: var(--f-display); letter-spacing: .005em; }
.widget-title h3 { font-size: 19px; font-weight: 700; }
.widget-hint { color: var(--ink-soft); font-size: 15px; margin: -4px 0 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.col2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.col3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: .03em; }
.field input[type="text"], .field textarea, .field select, input.txt, select.txt, textarea.txt {
  width: 100%; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper);
}
input[type="range"] { width: 100%; accent-color: var(--accent); }
.slider-row { display: grid; grid-template-columns: minmax(110px, 180px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; }
.slider-row .val { font-family: var(--f-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.stat .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); }
.stat .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .v small { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.stat.good { border-color: var(--good); background: var(--good-soft); }
.stat.bad { border-color: var(--pencil); background: var(--pencil-soft); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: 12.5px; font-family: var(--f-mono); border: 1px solid var(--rule); background: var(--paper); }
.pill.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.pill.bad { background: var(--pencil-soft); border-color: var(--pencil); color: var(--pencil); }
.pill.acc { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.mono { font-family: var(--f-mono); font-size: 13px; }
.muted { color: var(--ink-soft); }
.scroll-x { overflow-x: auto; }
svg text { font-family: var(--f-mono); }
.chip {
  display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 7px; border-radius: 6px; margin: 2px;
  font-family: var(--f-mono); font-size: 14px; white-space: pre; border: 1px solid transparent;
}
.chip sub { font-size: 10px; opacity: .75; }
.out-box { border: 1px dashed var(--rule); border-radius: 10px; padding: 10px 12px; background: var(--paper); min-height: 48px; }
.log { font-family: var(--f-mono); font-size: 12.5px; max-height: 190px; overflow-y: auto; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.log div { white-space: pre-wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 7px 12px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* clickable diagram */
.diagram-wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.diagram-wrap svg { width: 100%; height: auto; display: block; }
.node { cursor: pointer; }
.node rect, .node path.shape { transition: fill .2s, stroke-width .2s; }
.node:hover rect, .node.sel rect { stroke-width: 3; }
.detail-panel { border: 1px solid var(--rule); border-radius: 10px; padding: 14px; background: var(--paper); min-height: 200px; }
.detail-panel h4 { font-size: 18px; margin-bottom: 6px; }
.detail-panel p { margin: 0 0 8px; font-size: 15px; }
.detail-panel .paths { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.detail-panel .paths a { font-family: var(--f-mono); font-size: 12.5px; word-break: break-all; }

/* quiz */
.quiz { margin-top: 44px; max-width: var(--measure); }
.quiz h2 { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; margin-top: 14px; }
.q .qtext { font-weight: 700; margin-bottom: 10px; }
.q .opts { display: grid; gap: 8px; }
.q .opt {
  text-align: left; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; line-height: 1.4;
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start;
}
.q .opt .key { font-family: var(--f-mono); font-size: 12px; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--rule); display: grid; place-items: center; }
.q .opt:hover:not(:disabled) { border-color: var(--accent); }
.q .opt.right { border-color: var(--good); background: var(--good-soft); }
.q .opt.wrong { border-color: var(--pencil); background: var(--pencil-soft); }
.q .opt:disabled { cursor: default; }
.q .why { margin-top: 10px; font-size: 15px; padding: 10px 12px; border-radius: 9px; background: var(--paper); border-left: 3px solid var(--accent); }
.q .why.ok { border-color: var(--good); }
.q .why.no { border-color: var(--pencil); }

/* lesson footer */
.lesson-foot { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; max-width: var(--measure); border-top: 1px solid var(--rule); padding-top: 22px; }
.notes { margin-top: 30px; max-width: var(--measure); }
.notes summary { cursor: pointer; font-family: var(--f-mono); font-size: 14px; color: var(--accent); }
.notes textarea { width: 100%; min-height: 140px; margin-top: 8px; padding: 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet) repeating-linear-gradient(var(--sheet) 0 27px, var(--rule) 27px 28px); line-height: 28px; font-family: var(--f-body); }

/* glossary drawer */
.drawer-scrim { position: fixed; inset: 0; background: rgba(10, 20, 40, .35); z-index: 60; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 61; background: var(--sheet);
  border-left: 1px solid var(--rule); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.drawer header h2 { font-size: 22px; font-weight: 700; flex: 1; }
.drawer .search { padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.drawer .gl-list { overflow-y: auto; padding: 8px 16px 40px; }
.gl-item { padding: 12px 0; border-bottom: 1px dashed var(--rule); }
.gl-item dt { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.gl-item dd { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; }
.gl-item.flash { background: var(--accent-soft); }

.tooltip {
  position: fixed; z-index: 70; max-width: 320px; background: var(--sheet-2); color: var(--ink); padding: 10px 12px; border-radius: 6px;
  font-size: 14px; line-height: 1.45; box-shadow: var(--shadow); pointer-events: none; border: 1px solid var(--rule-strong);
}
.tooltip b { display: block; font-family: var(--f-mono); font-size: 13px; color: var(--accent); margin-bottom: 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80;
  background: var(--sheet-2); color: var(--ink); padding: 12px 18px; border-radius: 8px; box-shadow: var(--glow); border: 1px solid var(--accent); font-family: var(--f-mono); font-size: 14px;
  display: flex; gap: 10px; align-items: center; font-weight: 700; max-width: calc(100% - 32px);
}
.toast .xp { background: var(--accent); color: var(--accent-ink); font-family: var(--f-mono); padding: 1px 8px; border-radius: 6px; }

kbd { font-size: 12px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--sheet); }
.kbd-hint { font-size: 13px; color: var(--ink-faint); }

@media (max-width: 1100px) {
  .progress-bar { width: 100px; }
  .diagram-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; z-index: 50; top: calc(var(--header-h) + env(safe-area-inset-top, 0px)); left: 0; width: min(320px, 88vw);
    height: calc(100% - var(--header-h) - env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform .25s ease;
    background: var(--sheet); box-shadow: var(--shadow);
  }
  body.rail-open .rail { transform: none; }
  .menu-btn { display: inline-grid; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .progress-wrap .progress-bar { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .brand-name { font-size: 16px; }
  .brand-name span, .progress-wrap { display: none; }
  .rank-chip .rname, .progress-label .long { display: none; }
  .col2, .col3 { grid-template-columns: minmax(0, 1fr); }
  .slider-row { grid-template-columns: minmax(0, 1fr) 60px; }
  .slider-row .lbl { grid-column: 1 / -1; }
  .widget { padding: 14px; }
  .kbd-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open the course map" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#home" aria-label="Dynamo Ground School home">

      <rect x="2" y="2" width="28" height="28" rx="7" fill="var(--accent)"/>
      <path d="M9 10h6.5a6 6 0 0 1 0 12H9z" fill="none" stroke="var(--accent-ink)" stroke-width="2.6"/>
      <circle cx="22.5" cy="10" r="2.4" fill="var(--hl)"/>
    </svg>
    <span class="brand-name">Dynamo <span>Ground School</span></span>
  </a>
  <div class="spacer"></div>
  <div class="progress-wrap" title="Course progress">

    <span class="progress-label" id="progLabel">0/0</span>
  </div>
  <button class="rank-chip" id="rankChip" title="Your rank and XP">
    <span class="wings" id="rankLevel">1</span><span class="rname" id="rankName">Cadet</span><b id="xpVal">0 XP</b>
  </button>
  <button class="icon-btn" id="glossBtn" aria-label="Open the glossary" title="Glossary (g)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>
  </button>
  <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
  </button>
</header>

<div class="shell">

  <main class="main" id="main" tabindex="-1">

  </main>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="drawerScrim" class="drawer-scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Glossary">
  <header>
    <h2>Glossary</h2>
    <button class="icon-btn" id="drawerClose" aria-label="Close the glossary">✕</button>
  </header>
  <div class="search"><input class="txt" id="glSearch" type="text" placeholder="Search terms: KV cache, NIXL, Arc…" aria-label="Search the glossary"></div>
  <dl class="gl-list" id="glList"></dl>
